# ═══════════════════════════════════════════════════════════════════════════
#  Registro dei modelli disponibili al sistema ORC
#
#  Questo file e' CONFIGURAZIONE, non codice: aggiungere un modello, cambiare
#  un prezzo o introdurre una nuova capacita' non deve mai richiedere di
#  modificare Python (decisione D9 del PIANO_completo.md).
#
#  Riferimenti: PIANO_completo.md §3.11 (tassonomia delle capacita' e unita'
#  di fatturazione multiple) e §3.12 (costo marginale vs costo fisso).
#
#  I prezzi vanno trascritti ESATTAMENTE come li espone il fornitore: la
#  sezione [units] qui sotto dice al contabile a quante unita' si riferiscono.
#  Prezzi verificati ad agosto 2026 — vanno riverificati periodicamente.
# ═══════════════════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────────────────
#  BASI DI PREZZO
#
#  Per ogni unita' di consumo, a quante unita' si riferisce il prezzo scritto
#  nella sezione [models]. Serve perche' i fornitori usano scale diverse: i
#  token si quotano per milione, le immagini per singolo pezzo.
#
#  Il contabile applica una sola formula, valida per tutte le unita':
#
#      costo = quantita' / base * prezzo
#
#  Esempi:  350 token input  -> 350 / 1_000_000 * 5.00 = $0.00175
#             3 immagini     ->   3 / 1         * 0.003 = $0.009
#            25 crediti      ->  25 / 1         * 0.01  = $0.25
#
#  Aggiungere qui una riga e' l'unico passo necessario per supportare una
#  nuova unita' di fatturazione.
# ───────────────────────────────────────────────────────────────────────────
[units]
input_tokens        = 1_000_000   # prezzi per milione di token
output_tokens       = 1_000_000
cached_input_tokens = 1_000_000   # token di input serviti dalla cache
cache_write_tokens  = 1_000_000   # token scritti nella prompt cache
input_text_tokens   = 1_000_000   # immagini: token del prompt testuale
input_image_tokens  = 1_000_000   # immagini: token delle immagini in input
output_text_tokens  = 1_000_000   # immagini: token testuali emessi dal modello
output_image_tokens = 1_000_000   # immagini: token immagine generati
character           = 1_000_000   # sintesi vocale (TTS)
image               = 1           # per immagine generata
video_second        = 1           # per secondo di video
credit              = 1           # servizi a crediti (es. generazione 3D)
audio_minute        = 1           # trascrizione (STT)


# ───────────────────────────────────────────────────────────────────────────
#  COSTI DI ACCESSO  (decisione D12)
#
#  Costi fissi ricorrenti per fornitore. NON entrano nel calcolo del costo
#  per chiamata: sono costi affondati, non variano in base alle decisioni del
#  router e non devono quindi influenzarne le scelte. Vanno pero' dichiarati
#  a parte nel capitolo sperimentale, altrimenti il costo complessivo del
#  sistema risulterebbe sottostimato.
#
#  A parita' di capacita' si preferisce il fornitore con fatturazione
#  marginale: l'abbonamento rende il costo unitario dipendente dal tasso di
#  utilizzo mensile, quindi non riproducibile fra esecuzioni.
# ───────────────────────────────────────────────────────────────────────────
#  base_url / api_key_env — come si raggiunge il fornitore. Entrambi
#  FACOLTATIVI: un models.toml che descriva solo prezzi resta valido, ed e'
#  cio' che usano i test. Chi vuole chiamare davvero il fornitore li pretende
#  al momento dell'uso, con un errore che nomina provider e variabile.
#
#  api_key_env e' il NOME della variabile d'ambiente, mai il valore. Il
#  registro viene letto dai test, stampato nei messaggi d'errore e in
#  prospettiva serializzato nei log: una chiave qui dentro uscirebbe da
#  qualche parte, prima o poi.
#
#  Dal 12 ottobre 2026 l'infrastruttura e' UNA: OpenRouter, con una sola chiave
#  (`ORC2_OPENROUTER_KEY`). Gli altri fornitori (Anthropic, Moonshot, MiniMax,
#  OpenAI, Tripo) e il proxy locale delle richieste sono stati scollegati: che cosa, perche' e come
#  ricollegarli sta in `docs/INFRASTRUTTURE_SCOLLEGATE.md`.
#
#  Dietro un aggregatore lo stesso modello puo' essere servito da fornitori
#  diversi, anche quantizzati: per questo un modello puo' fissare il fornitore con
#  `provider_order` (vedi MODELLI). Il record di consumo porta il costo che
#  OpenRouter dichiara (`reported_cost`) e chi ha risposto (`served_by`).

[providers.openrouter]
monthly_fee = 0.0
base_url    = "https://openrouter.ai/api/v1"
api_key_env = "ORC2_OPENROUTER_KEY"


# ───────────────────────────────────────────────────────────────────────────
#  MODELLI
#
#  capabilities — nomi leggibili, mappati sulla tassonomia di §3.11:
#      reasoning (C1)     pianificazione, decomposizione
#      code      (C2)     generazione di codice (include SVG, che e' codice)
#      text      (C3)     scrittura di contenuti
#      vision_input (C4)  lettura di immagini: mockup, screenshot
#      image_gen (C5)     generazione di immagini raster
#      video_gen (C7)     generazione di video
#      model_3d  (C8)     generazione di asset 3D
#      tts       (C9)     sintesi vocale
#      stt       (C10)    trascrizione
#      embedding (C11)    vettori per RAG e per il router stesso
#      rerank    (C12)    riordino per rilevanza
#
#  Il filtro per capacita' PRECEDE quello sul costo: un modello privo della
#  capacita' richiesta non e' confrontabile sul prezzo, per quanto economico.
#
#  api_model — FACOLTATIVO. Il nome con cui OpenRouter conosce il modello
#  (`casa/modello`), che differisce dalla chiave del progetto: la chiave resta
#  quella di contabilita', ledger e ruoli. Se manca si usa la chiave stessa.
#  Letto dall'elenco pubblico di OpenRouter.
#
#  provider_order — FACOLTATIVO. Lista di slug dei fornitori a cui OpenRouter deve
#  limitare la richiesta, senza ripiego su altri (`allow_fallbacks = false`).
#  Senza, due run dello stesso modello possono essere servite da fornitori
#  diversi, anche quantizzati, e non sono confrontabili. Lo slug si legge
#  dall'elenco degli endpoint del modello su OpenRouter.
#
#  prices — solo le unita' pertinenti al modello. Un'unita' assente significa
#  che il modello non offre quel tipo di consumo.
# ───────────────────────────────────────────────────────────────────────────

# --- Fascia frontier: planner, escalation finale, giudice ---

# Listino dell'endpoint `anthropic` di OpenRouter (letto il 10 ott 2026, uguale a quello
# ufficiale Anthropic): input 4, output 20, scrittura cache 5 minuti 5, lettura 0.20.
# Anthropic non mette in cache da solo: la richiesta deve contenere `cache_control`. Lo si
# dichiara qui con `extra_body` (cache automatica, 5 minuti: il punto di taglio si sposta
# sull'ultimo blocco ad ogni richiesta). Verificato il 12 ott 2026 con una prova isolata:
# 2933 token scritti alla prima richiesta e letti alla seconda. Minimo cacheable di Opus 5.5:
# 512 token. Kimi e MiniMax non lo richiedono (cache automatica). Il gateway non invia
# `effort`.
[models.opus-5-5]
provider       = "openrouter"
api_model      = "anthropic/claude-opus-5.5"
provider_order = ["anthropic"]
extra_body     = { cache_control = { type = "ephemeral" } }
capabilities   = ["reasoning", "code", "text", "vision_input"]
prices         = { input_tokens = 4.00, output_tokens = 20.00, cached_input_tokens = 0.20, cache_write_tokens = 5.00 }

# --- Fascia media: worker su sotto-task complessi ---

# Endpoint `moonshotai/mxfp4` di OpenRouter (letto il 10 ott 2026): 3.00 / 15.00 / lettura
# cache 0.30, come il listino ufficiale Moonshot. Il fornitore e' fissato: l'elenco di
# OpenRouter mostra 0.50 per un altro fornitore (fp4), di cui non si sa se serva i pesi
# originali o una nuova compressione. Su questo endpoint la quantizzazione e' mxfp4, che e'
# la precisione NATIVA di Kimi K3 (scheda ufficiale: pesi MXFP4 e attivazioni MXFP8, con
# addestramento consapevole della quantizzazione): non e' una versione peggiorata. Nessun
# prezzo di scrittura in cache: se OpenRouter ne riportasse, il consumo risulterebbe non
# prezzato, non coperto da un numero non verificato.
[models.kimi-k3]
provider       = "openrouter"
api_model      = "moonshotai/kimi-k3"
provider_order = ["moonshotai/mxfp4"]
capabilities   = ["reasoning", "code", "text"]
prices         = { input_tokens = 3.00, output_tokens = 15.00, cached_input_tokens = 0.30 }

# --- Fascia economica: worker standard ---
# Fornitore fissato su `minimax/fp8`, l'endpoint di MiniMax stesso (12 ott 2026): listino
# 0.30 / 1.20 / 0.06 fino a 512k token di input (oltre, 0.60 / 2.40 / 0.12: non dichiarato, i
# task non ci arrivano). Senza fissarlo OpenRouter instrada al piu' economico, CoreWeave
# `fp4` (quantizzato, 0.23 / 0.96 / 0.05): in una run vera il costo riportato era il 21% sotto
# il listino, cioe' il listino non descriveva piu' quello che si pagava. Scelto senza una
# misura di confronto: l'unico indizio e' un confronto di siti aggregatori.
[models.minimax-m3]
provider       = "openrouter"
api_model      = "minimax/minimax-m3"
provider_order = ["minimax/fp8"]
capabilities   = ["reasoning", "code", "text"]
prices         = { input_tokens = 0.30, output_tokens = 1.20, cached_input_tokens = 0.06 }

# --- Infrastruttura: embedding per RAG e per il router appreso (S3) ---

[models.text-embedding-3-small]
provider     = "openrouter"
api_model    = "openai/text-embedding-3-small"
capabilities = ["embedding"]
prices       = { input_tokens = 0.02 }

# ───────────────────────────────────────────────────────────────────────────
#  RUOLI  (stadio S1: assegnazione statica)
#
#  requires — le capacita' che il MESTIERE richiede, non quelle che il modello
#  assegnato possiede per caso. Il registro verifica al caricamento che il
#  modello le abbia tutte: un ruolo mal assegnato fallisce all'avvio, non a
#  meta' di una run gia' pagata.
# ───────────────────────────────────────────────────────────────────────────

[roles.planner]
model    = "opus-5-5"
requires = ["reasoning", "code"]

[roles.worker]
model    = "kimi-k3"
requires = ["code"]

[roles.worker_cheap]
model    = "minimax-m3"
requires = ["code"]



# ───────────────────────────────────────────────────────────────────────────
#  CAPACITA' NON TESTUALI — esempi disattivati
#
#  Servono alla demo multi-capacita' (M4), non alla campagna sperimentale di
#  M7, che resta focalizzata su codice e frontend (decisione D11). Sono qui
#  come riferimento: attivarli richiede solo di togliere i commenti e
#  verificare i prezzi correnti.
# ───────────────────────────────────────────────────────────────────────────

